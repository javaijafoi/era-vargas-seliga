  <title>Era Vargas: O Equilibrista — Se Liga 3D</title>
  <link rel="stylesheet" href="./jogo/bundle.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #090312;
      color: #ffffff;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card-scope {
      view-transition-scope: all;
      overflow: clip;
    }
    .card-panel {
      view-transition-name: card-panel;
      padding: 26px 8px 10px 0;
    }
    @media (max-width: 768px) {
      .card-panel {
        padding: 20px 4px 4px 0;
      }
    }
    ::view-transition-group(card-panel) {
      animation-duration: 260ms;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes carimboSlam {
      0% { transform: rotate(-12deg) scale(2.4); opacity: 0; }
      65% { transform: rotate(-12deg) scale(0.95); opacity: 1; }
      100% { transform: rotate(-11deg) scale(1); opacity: 1; }
    }
    .carimbo-anim {
      animation: carimboSlam 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes alertaPulso {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 45, 85, 0.6); }
      50% { box-shadow: 0 0 18px 3px rgba(255, 45, 85, 0.75); }
    }
    .pilar-perigo {
      animation: alertaPulso 1.1s ease-in-out infinite;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
    }
    button:focus-visible {
      outline: 3px solid #ffd000;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*),
      ::view-transition-old(*),
      ::view-transition-new(*) {
        animation: none !important;
      }
      .carimbo-anim,
      .pilar-perigo {
        animation: none !important;
      }
    }
  </style>
